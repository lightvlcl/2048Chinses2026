# ============================================================
# Codemagic 自動簽署版 —— iOS 專用
# ============================================================
workflows:
  ios-release:
    name: 2048 iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lightvlcl.game2048
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prepare iOS project
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Apply app icon
        script: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          cp resources/icon-1024.png "$ICON_DIR/AppIcon-512@2x.png"
          if [ -f "$ICON_DIR/AppIcon-512.png" ]; then
            cp resources/icon-1024.png "$ICON_DIR/AppIcon-512.png"
          fi
      - name: Initialize code signing settings
        script: |
          # 讓 Codemagic 自動透過 API 抓取或建立憑證與描述檔
          app-store-connect fetch-signing-files "$bundle_identifier" \
            --type "$distribution_type" \
            --create
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    
    # 關鍵：在 workflow 內宣告整合，對應後台金鑰名稱
    integrations:
      app_store_connect: APPLE API 1

    # 關鍵：正確的巢狀發布結構
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

workflows:
  ios-workflow:
    name: 2048 iOS Release Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.lightvlcl.2048Chinses2026"
        APP_NAME: "App"
    scripts:
      - name: Install dependencies and sync Capacitor
        script: |
          npm install
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Set up code signing profiles
        script: |
          # 自動將你在 Codemagic 網頁上傳的描述檔安全地對應到專案主體
          xcode-project use-profiles
      - name: Build and Export IPA
        script: |
          set -e
          mkdir -p build_output

          # 移除會汙染 Pods 的全域 Profile 指定，改由上面步驟自動處理
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme "App" \
            -configuration Release \
            -archivePath build_output/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="ZDK96PR9X3" \
            PRODUCT_BUNDLE_IDENTIFIER="com.lightvlcl.2048Chinses2026"

          xcodebuild -exportArchive \
            -archivePath build_output/App.xcarchive \
            -exportPath build_output \
            -exportOptionsPlist <(cat <<EOF
          {
            "method": "app-store",
            "signingStyle": "manual",
            "teamID": "ZDK96PR9X3",
            "provisioningProfiles": {
              "com.lightvlcl.2048Chinses2026": "Game2048Profile"
            },
            "stripSwiftSymbols": true
          }
          EOF
          )
    artifacts:
      - build_output/*.ipa

# ============================================================
# Codemagic 自動簽署最終版 —— iOS 專用
# ============================================================
workflows:
  ios-release:
    name: 2048 iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prepare iOS project
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Apply app icon
        script: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          cp resources/icon-1024.png "$ICON_DIR/AppIcon-512@2x.png"
          if [ -f "$ICON_DIR/AppIcon-512.png" ]; then
            cp resources/icon-1024.png "$ICON_DIR/AppIcon-512.png"
          fi
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

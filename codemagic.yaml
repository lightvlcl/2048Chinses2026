# ============================================================
# Codemagic 自動簽署修正版 —— iOS 專用
# ============================================================
workflows:
  ios-release:
    name: 2048 iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22
      xcode: latest
      groups:
        - ios_keys
      vars:
        APP_STORE_CONNECT_ISSUER_ID: "0b40cc93-4f2b-435d-8ba3-e59e0221e1f0"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "ZDK96PR9X3"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prepare iOS project
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Apply app icon
        script: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          cp resources/icon-1024.png "$ICON_DIR/AppIcon-512@2x.png"
          if [ -f "$ICON_DIR/AppIcon-512.png" ]; then
            cp resources/icon-1024.png "$ICON_DIR/AppIcon-512.png"
          fi
      - name: Set up code signing & Force Automatic
        script: |
          # 1. 抓取憑證
          app-store-connect fetch-signing-profiles \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY"
          
          # 2. 強制將專案設定改為自動簽署 (Automatic) 避免報錯
          cd ios/App
          plutil -replace PBXTarget.attributes.TargetAttributes.App.ProvisioningStyle -string Automatic App.xcodeproj/project.pbxproj || true
          cd ../..
      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App" \
            --code-sign-style Automatic
      - name: Publish to TestFlight
        script: |
          app-store-connect publish \
            --path "$(find $(pwd) -name "*.ipa")"

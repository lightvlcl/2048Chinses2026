workflows:
  ios-workflow:
    name: 2048 iOS Release Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.lightvlcl.2048Chinses2026"
        TEAM_ID: "58RATT4ABA"
        APP_NAME: "App"
    scripts:
      - name: Install dependencies and sync Capacitor
        script: |
          set -e
          echo "=== [1/3] 開始安裝專案依賴與同步 Capacitor ==="
          npm install
          
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          
          node -e 'const fs=require("fs");let p="ios/App/Podfile";let c=fs.readFileSync(p,"utf8");if(!c.includes("CODE_SIGNING_ALLOWED")){c=c.replace("post_install do |installer|", "post_install do |installer|\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings[\x27CODE_SIGNING_ALLOWED\x27] = \x27NO\x27;\n    end;\n  end;");fs.writeFileSync(p,c,"utf8");}' || true
          
          npx cap sync ios
          echo "✅ 依賴安裝完成"

      - name: Set up code signing and build IPA with Diagnostics
        script: |
          set -e
          mkdir -p build_output

          echo "=== [2/3] 初始化鑰匙圈與載入後台憑證/描述檔 ==="
          keychain initialize
          
          if ! xcode-project use-profiles; then
            echo "❌ 【錯誤攔截】找不到對應的描述檔！"
            exit 1
          fi

          echo "=== [3/3] 開始執行 Xcode Archive (專案打包) ==="
          if ! xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme "App" \
            -configuration Release \
            -archivePath build_output/App.xcarchive \
            archive \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="58RATT4ABA" \
            PRODUCT_BUNDLE_IDENTIFIER="com.lightvlcl.2048Chinses2026" \
            PROVISIONING_PROFILE_SPECIFIER="2048 Distribution Profile" \
            -allowProvisioningUpdates; then
            echo "❌ 【錯誤攔截】Xcode Archive 打包失敗！"
            exit 1
          fi

          echo "ℹ️ 正在匯出 IPA 檔案..."
          if ! xcodebuild -exportArchive \
            -archivePath build_output/App.xcarchive \
            -exportPath build_output \
            -exportOptionsPlist <(cat <<EOF
          {
            "method": "app-store",
            "signingStyle": "manual",
            "teamID": "58RATT4ABA",
            "provisioningProfiles": {
              "com.lightvlcl.2048Chinses2026": "2048 Distribution Profile"
            },
            "stripSwiftSymbols": true
          }
          EOF
          ); then
            echo "❌ 【錯誤攔截】匯出 IPA 失敗！"
            exit 1
          fi

          echo "🎉 恭喜！IPA 封裝與匯出完全成功！"
    artifacts:
      - build_output/*.ipa

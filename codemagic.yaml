workflows:
  ios-release-workflow:
    name: iOS Release Workflow
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      node: latest
    scripts:
      - name: 雙軌容錯構建與打包流程
        script: |
          # 1. 自動解壓縮憑證包
          if [ -f "ios.zip" ]; then
            echo "=== 正在解壓縮 ios.zip ==="
            unzip -o ios.zip
          fi
          
          # 修正雙重副檔名問題
          if [ -f "ios/cert/distribution.p12.p12" ]; then
            mv ios/cert/distribution.p12.p12 ios/cert/distribution.p12
            echo "✅ 已將憑證重新命名為標準 distribution.p12"
          fi

          CERT_PATH=$(find . -name "distribution.p12" | head -n 1)
          echo "✅ 定位憑證路徑: $CERT_PATH"

          # 2. 安裝 npm 依賴
          echo "=== 正在安裝 npm 依賴套件 ==="
          npm install

          # 3. 初始化鑰匙圈並匯入憑證
          keychain initialize
          DEFAULT_KEYCHAIN=$(keychain get-default)
          echo "=== 正在使用密碼匯入 p12 憑證到鑰匙圈 ==="
          security import "$CERT_PATH" -k "$DEFAULT_KEYCHAIN" -P "snVWkEtR" -A -T /usr/bin/codesign

          # 4. 同步 Capacitor iOS 專案
          if [ ! -d "ios/App" ]; then
            echo "=== 正在自動補齊 iOS 平台專案 ==="
            npx cap add ios
          fi
          
          npx cap sync ios
          
          # 5. 自動修正 Info.plist 與專案檔內的 Bundle ID
          echo "=== 正在全面修正 Bundle ID ==="
          plutil -replace CFBundleIdentifier -string "com.lightvlcl.2048Chinses2026" ios/App/App/Info.plist
          find ios/App -name "project.pbxproj" -exec sed -i '' 's/com.yourname.game2048/com.lightvlcl.2048Chinses2026/g' {} +

          # 6. 進入 iOS 專案目錄
          cd ios/App

          # =====================================================================
          # 🦵【第一條腿】優先嘗試：自動簽署 (Automatic Signing) 模式
          # 完美避開 Pods 不支援描述檔與憑證勾選錯誤的萬年痛點
          # =====================================================================
          echo "=== 🦵 [第一條腿] 嘗試使用自動簽署進行 Archive 打包 ==="
          
          sed -i '' 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/DevelopmentTeam = "";/DevelopmentTeam = "58RATT4ABA";/g' App.xcodeproj/project.pbxproj

          # 備份一份專案檔以供第二條腿使用
          cp App.xcodeproj/project.pbxproj App.xcodeproj/project.pbxproj.bak

          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     DEVELOPMENT_TEAM="58RATT4ABA" \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     -allowProvisioningUpdates \
                     archive -archivePath build/App.xcarchive && LEG1_SUCCESS=true || LEG1_SUCCESS=false

          # =====================================================================
          # 🦵【第二條腿】備援嘗試：若第一條腿受阻，切換為命令列帶入自動憑證容錯
          # =====================================================================
          if [ "$LEG1_SUCCESS" = false ]; then
            echo "⚠️ ---------------------------------------------------------"
            echo "⚠️ [第一條腿] 遭遇阻礙，無縫啟動 [第二條腿：備援自動簽署模式]..."
            echo "⚠️ ---------------------------------------------------------"
            
            # 還原專案檔
            cp App.xcodeproj/project.pbxproj.bak App.xcodeproj/project.pbxproj
            rm -rf build/App.xcarchive

            xcodebuild -workspace App.xcworkspace \
                       -scheme App \
                       -sdk iphoneos \
                       -configuration Release \
                       DEVELOPMENT_TEAM="58RATT4ABA" \
                       -allowProvisioningUpdates \
                       CODE_SIGN_STYLE=Automatic \
                       archive -archivePath build/App.xcarchive
          fi

          # 7. 建立合法的 exportOptions.plist
          echo "=== 正在建立 exportOptions.plist ==="
          python3 -c '
          import plistlib
          data = {
              "method": "ad-hoc",
              "teamID": "58RATT4ABA",
              "signingStyle": "automatic",
              "signingCertificate": "Apple Distribution"
          }
          with open("exportOptions.plist", "wb") as f:
              plistlib.dump(data, f)
          '

          # 8. 正在匯出 .ipa 檔案
          echo "=== 正在匯出 .ipa 檔案 ==="
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportOptionsPlist exportOptions.plist \
                     -exportPath ../../build_output
    artifacts:
      - build_output/**/*.ipa

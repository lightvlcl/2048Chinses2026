#!/bin/bash
set -e

echo "=== 1. 環境檢查與準備 ==="
echo "Node version: $(node -v)"
echo "NPM version: $(npm -v)"
echo "Flutter/Ionic/Capacitor setup check..."

# 假設前面的安裝、依賴與憑證匯入（將 p12 放入鑰匙圈、描述檔放到 ~/Library/MobileDevice/Provisioning Profiles/）已經完成
# 請確保你在此之前已經把環境變數 $PROVISIONING_PROFILE_UUID 和憑證準備好

# 2. 安裝專案相依套件與建置網頁端
echo "=== 2. 安裝專案相依套件 ==="
npm install

echo "=== 3. 建置前端專案 (Build Web) ==="
npm run build # 或對應你的打包指令，例如 ionic build

# 4. 同步 Capacitor
echo "=== 4. 同步 Capacitor iOS 專案 ==="
npx cap sync ios

# 5. 尋找與自動抓取描述檔 UUID（確保描述檔已經在步驟前被放到系統資料夾）
echo "=== 5. 自動定位並讀取描述檔 UUID ==="
PROVISION_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
# 抓取資料夾內最新的 .mobileprovision 檔案
LATEST_PROFILE=$(ls -t "$PROVISION_DIR"/*.mobileprovision 2>/dev/null | head -n 1)

if [ -z "$LATEST_PROFILE" ]; then
    echo "❌ 錯誤：找不到任何描述檔 (.mobileprovision)，請確認前面的步驟是否有正確下載並放置！"
    exit 1
fi

echo "找到描述檔: $LATEST_PROFILE"

# 利用 python 解析出 UUID
PROVISIONING_PROFILE_UUID=$(python3 -c '
import sys, plistlib, subprocess
try:
    # 透過 security cms 指令讀取描述檔的 plist 內容
    out = subprocess.check_output(["security", "cms", "-D", "-i", sys.argv[1]])
    data = plistlib.loads(out)
    print(data.get("UUID"))
except Exception as e:
    print("", end="")
' "$LATEST_PROFILE")

if [ -z "$PROVISIONING_PROFILE_UUID" ]; then
    echo "❌ 錯誤：無法從描述檔中解析出 UUID！"
    exit 1
fi

echo "✅ 成功解析出描述檔 UUID: $PROVISIONING_PROFILE_UUID"

# 6. 進入 iOS 專案目錄並改為【手動簽署 Manual】，綁定 Team 與 UUID 描述檔
cd ios/App
echo "=== 6. 正在設定手動簽署與 Development Team ==="

# 強制將專案簽署風格改為 Manual（手動）
find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' {} +

# 設定 Development Team
sed -i '' 's/DevelopmentTeam = "";/DevelopmentTeam = "58RATT4ABA";/g' App.xcodeproj/project.pbxproj

find . -name "project.pbxproj" -exec sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' {} +

# 將確切的 UUID 寫入 project.pbxproj 的 Release 與 Debug 設定中
python3 -c '
import sys, re
pbxproj_path = "App.xcodeproj/project.pbxproj"
with open(pbxproj_path, "r") as f:
    content = f.read()

uuid = "'"$PROVISIONING_PROFILE_UUID"'"

# 在 Release 區塊精準注入 PROVISIONING_PROFILE
content = re.sub(
    r"(CODE_SIGN_IDENTITY = \"iPhone Distribution\";)(?![\s\S]*PROVISIONING_PROFILE)",
    r"\1\n					PROVISIONING_PROFILE = \"" + uuid + r"\";",
    content
)

with open(pbxproj_path, "w") as f:
    f.write(content)
print("✅ 成功將描述檔 UUID 寫入 Xcode 專案設定")
'

# 7. 執行 Archive 打包（使用 Manual Signing，完全不需連線 Apple 帳號）
echo "=== 7. 開始進行 Archive 打包 (Manual Signing) ==="
xcodebuild -workspace App.xcworkspace \
           -scheme App \
           -sdk iphoneos \
           -configuration Release \
           DEVELOPMENT_TEAM="58RATT4ABA" \
           CODE_SIGN_STYLE="Manual" \
           PROVISIONING_PROFILE="$PROVISIONING_PROFILE_UUID" \
           archive -archivePath build/App.xcarchive

# 8. 建立合法的 exportOptions.plist（手動模式）
echo "=== 8. 正在建立 exportOptions.plist ==="
python3 -c '
import plistlib
data = {
    "method": "ad-hoc",
    "teamID": "58RATT4ABA",
    "signingStyle": "manual",
    "provisioningProfiles": {
        "com.lightvlcl.2048Chinses2026": "'"$PROVISIONING_PROFILE_UUID"'"
    }
}
with open("exportOptions.plist", "wb") as f:
    plistlib.dump(data, f)
'

# 9. 匯出 .ipa 檔案
echo "=== 9. 正在匯出 .ipa 檔案 ==="
mkdir -p ../../build_output
xcodebuild -exportArchive \
           -archivePath build/App.xcarchive \
           -exportOptionsPlist exportOptions.plist \
           -exportPath ../../build_output

echo "🎉 打包流程全部完成！IPA 檔案應已輸出至 build_output 目錄。"

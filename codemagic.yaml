workflows:
  ios-release-workflow:
    name: iOS Release Workflow
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      node: latest
    scripts:
      - name: 完整構建與打包流程
        script: |
          # 1. 自動解壓縮憑證包
          if [ -f "ios.zip" ]; then
            echo "=== 正在解壓縮 ios.zip ==="
            unzip -o ios.zip
          fi
          
          if [ -f "ios/cert/distribution.p12" ]; then
            echo "✅ 成功找到 distribution.p12 憑證！"
          else
            echo "⚠️ 警告：未找到 p12 憑證，請檢查 zip 內容。"
          fi

          # 2. 安裝 npm 依賴
          echo "=== 正在安裝 npm 依賴套件 ==="
          npm install

          # 3. 初始化鑰匙圈並匯入憑證
          keychain initialize
          
          CERT_PATH="ios/cert/distribution.p12"
          PROFILE_PATH="ios/cert/profile.mobileprovision"
          
          echo "=== 正在匯入 p12 憑證到鑰匙圈 ==="
          keychain add-certificates --certificate "$CERT_PATH"
          
          # 4. 安裝 mobileprovision 描述檔並抓取 UUID
          echo "=== 正在安裝 mobileprovision 描述檔 ==="
          PROFILE_UUID=$(grep -a -A 1 -E "<key>UUID</key>" "$PROFILE_PATH" | tail -n 1 | sed -e 's/<string>//g' -e 's/<\/string>//g' | tr -d '[:space:]')
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID.mobileprovision"
          
          echo "✅ 描述檔安裝完成！UUID: $PROFILE_UUID"

          # 5. 同步 Capacitor iOS 專案
          if [ ! -d "ios/App" ]; then
            echo "=== 正在自動補齊 iOS 平台專案 ==="
            npx cap add ios
          fi
          
          npx cap sync ios
          
          # 6. 自動修正專案 Bundle ID
          echo "=== 正在修正 Bundle ID ==="
          plutil -replace CFBundleIdentifier -string "com.lightvlcl.2048Chinses2026" ios/App/App/Info.plist
          
          # 7. 進入 iOS 專案目錄並打包
          cd ios/App
          
          echo "=== 開始進行 Xcode Archive 打包 ==="
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     DEVELOPMENT_TEAM="58RATT4ABA" \
                     PROVISIONING_PROFILE="$PROFILE_UUID" \
                     PRODUCT_BUNDLE_IDENTIFIER="com.lightvlcl.2048Chinses2026" \
                     archive -archivePath build/App.xcarchive
                     
          # 8. 匯出 .ipa 檔案
          echo "=== 正在匯出 .ipa 檔案 ==="
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportOptionsPlist exportOptions.plist \
                     -exportPath ../../build_output
    artifacts:
      - build_output/**/*.ipa

#!/usr/bin/env bash

set -e
mkdir -p build_output

# 1. 初始化金鑰環，準備存放憑證
codemagic initialize-keychain

# 2. 自動從 Developer Portal 抓取憑證與描述檔
app-store-connect fetch-signing-files \
  --type IOS_APP_STORE \
  com.lightvlcl.2048Chinses2026

# 3. 執行 Xcode Build (自動套用剛才抓到的憑證與描述檔)
xcodebuild -workspace ios/App/App.xcworkspace \
  -scheme "App" \
  -configuration Release \
  -archivePath build_output/App.xcarchive \
  archive \
  CODE_SIGN_STYLE=Automatic \
  DEVELOPMENT_TEAM="58RATT4ABA" \
  PRODUCT_BUNDLE_IDENTIFIER="com.lightvlcl.2048Chinses2026" \
  -allowProvisioningUpdates

# 4. 匯出 IPA
xcodebuild -exportArchive \
  -archivePath build_output/App.xcarchive \
  -exportPath build_output \
  -exportOptionsPlist <(cat <<EOF
{
  "method": "app-store",
  "signingStyle": "automatic",
  "teamID": "58RATT4ABA",
  "stripSwiftSymbols": true
}
EOF
)

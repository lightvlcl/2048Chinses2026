# ============================================================
# 2048新中版 —— Codemagic 雲端建置設定
# 全程免 Mac：codemagic.io 網頁端觸發 → 雲上 Mac 打包 → 產 .ipa
# ============================================================

definitions:
  scripts:
    # ---------- 共用步驟 ----------
    - &unpack
      name: 解壓縮 iOS 工程與憑證包
      script: |
        set -e
        if [ -f ios.zip ]; then
          echo "=== 解壓縮 ios.zip ==="
          unzip -o -q ios.zip
        fi

        # 憑證檔名在不同批次間不一致，全部正規化成後續腳本認的 distribution.p12 / profile.mobileprovision
        if [ ! -f ios/cert/distribution.p12 ]; then
          FOUND=$(find ios/cert -maxdepth 1 -name "*.p12" | head -n 1)
          if [ -z "$FOUND" ]; then echo "✗ 找不到 .p12 憑證"; exit 1; fi
          mv -f "$FOUND" ios/cert/distribution.p12
          echo "憑證已正規化：$FOUND → ios/cert/distribution.p12"
        fi
        if [ ! -f ios/cert/profile.mobileprovision ]; then
          FOUND=$(find ios/cert -maxdepth 1 -name "*.mobileprovision" | head -n 1)
          if [ -z "$FOUND" ]; then echo "✗ 找不到 .mobileprovision 描述檔"; exit 1; fi
          mv -f "$FOUND" ios/cert/profile.mobileprovision
          echo "描述檔已正規化：$FOUND → ios/cert/profile.mobileprovision"
        fi
        ls -la ios/cert/

    - &deps
      name: 安裝 npm 依賴 + Capacitor 同步（含 pod install）
      script: |
        set -e
        npm install
        if [ ! -d ios/App ]; then
          echo "=== 補齊 iOS 平台 ==="
          npx cap add ios
        fi
        npx cap sync ios

    - &certs
      name: 匯入 p12 憑證與行動描述檔
      script: |
        set -e
        CERT_PATH=$(find . -name "distribution.p12" -not -path "*/node_modules/*" | head -n 1)
        PROFILE_PATH=$(find . -name "profile.mobileprovision" -not -path "*/node_modules/*" | head -n 1)
        if [ -z "$CERT_PATH" ] || [ -z "$PROFILE_PATH" ]; then
          echo "找不到憑證或描述檔，請確認 ios/cert/ 已提交到倉庫"
          exit 1
        fi
        echo "憑證: $CERT_PATH"
        echo "描述檔: $PROFILE_PATH"

        # p12 密碼：優先用 Codemagic 加密環境變數 P12_PASSWORD，否則帶入預設密碼 zFIWXMyv
        P12_PASSWORD="${P12_PASSWORD:-zFIWXMyv}"

        echo "=== 初始化 keychain 並匯入憑證 ==="
        keychain initialize
        keychain add-certificates --certificate "$CERT_PATH" --password "$P12_PASSWORD" \
          || security import "$CERT_PATH" -k "$(keychain get-default)" -P "$P12_PASSWORD" -A -T /usr/bin/codesign

        echo "=== 安裝描述檔 ==="
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        python3 - "$PROFILE_PATH" > "$CM_BUILD_DIR/signing.env" <<'PY'
        import plistlib, sys
        data = open(sys.argv[1], "rb").read()
        start = data.index(b"<?xml")
        end = data.rindex(b"</plist>") + len(b"</plist>")
        p = plistlib.loads(data[start:end])
        print('PROFILE_UUID="%s"' % p["UUID"])
        print('TEAM_ID="%s"' % p["TeamIdentifier"][0])
        print('PROFILE_NAME="%s"' % p.get("Name", ""))
        PY
        . "$CM_BUILD_DIR/signing.env"
        echo "描述檔 UUID: $PROFILE_UUID"
        echo "Team ID: $TEAM_ID"
        cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID.mobileprovision"
        echo "CERT_PATH=\"$CERT_PATH\"" >> "$CM_BUILD_DIR/signing.env"

    - &use_profiles
      name: Codemagic 套用簽署設定
      script: |
        set -e
        . "$CM_BUILD_DIR/signing.env"
        xcode-project use-profiles \
          --workspace "$XCODE_WORKSPACE" \
          --bundle-id "$BUNDLE_ID" \
          || xcode-project use-profiles

    - &build_ipa
      name: 打包 IPA
      script: |
        set -e
        xcode-project build-ipa \
          --workspace "$XCODE_WORKSPACE" \
          --scheme "$XCODE_SCHEME"

workflows:
  # ============================================================
  # 1) 主線：Codemagic 原生簽署工具 (TestFlight)
  # ============================================================
  ios-release:
    name: ① 打包 → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22
      xcode: latest
      vars:
        BUNDLE_ID: "com.lightvlcl.2048Chinses2026"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    integrations:
      app_store_connect: Codemagic
    scripts:
      - *unpack
      - *deps
      - *certs
      - *use_profiles
      - *build_ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # ============================================================
  # 1.5) 直送審核
  # ============================================================
  ios-submit-store:
    name: ② 打包 → 直接送審上架
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22
      xcode: latest
      vars:
        BUNDLE_ID: "com.lightvlcl.2048Chinses2026"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    integrations:
      app_store_connect: Codemagic
    scripts:
      - *unpack
      - *deps
      - *certs
      - *use_profiles
      - *build_ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        cancel_previous_submissions: true
        release_type: MANUAL

  # ============================================================
  # 1.8) 全自動上架（改用指令碼與 .p8 金鑰直接上傳，不依賴網頁端整合）
  # ============================================================
  ios-auto-release:
    name: ③ 全自動：打包 → 上傳 → 送審
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22
      xcode: latest
      groups:
        - ios_keys
      vars:
        BUNDLE_ID: "com.lightvlcl.2048Chinses2026"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - *unpack
      - *deps
      - *certs
      - *use_profiles
      - name: 打包 IPA
        script: |
          set -e
          . "$CM_BUILD_DIR/signing.env"
          
          cat > "$CM_BUILD_DIR/exportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_UUID</string>
              </dict>
          </dict>
          </plist>
          PLIST

          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist "$CM_BUILD_DIR/exportOptions.plist"
      - name: 使用 .p8 金鑰上傳至 App Store Connect
        script: |
          set -e
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "✗ 找不到產出的 IPA 檔案"
            exit 1
          fi
          echo "找到 IPA: $IPA_PATH"

          mkdir -p ~/.private_keys
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8
          chmod 600 ~/.private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8

          echo "=== 開始透過 altool 上傳到 App Store Connect ==="
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
    artifacts:
      - build/ios/ipa/*.ipa

  # ============================================================
  # 2) 備援：全手動 xcodebuild
  # ============================================================
  ios-release-manual:
    name: iOS Release Workflow（手動簽署）
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22
      xcode: latest
      vars:
        BUNDLE_ID: "com.lightvlcl.2048Chinses2026"
        TEAM_ID: "58RATT4ABA"
    scripts:
      - name: 穩健手動簽署打包流程
        script: |
          #!/usr/bin/env bash
          set -e

          if [ -f "ios.zip" ]; then
            echo "=== 正在解壓縮 ios.zip ==="
            unzip -o ios.zip
          fi

          if [ ! -f ios/cert/distribution.p12 ]; then
            FOUND=$(find ios/cert -maxdepth 1 -name "*.p12" | head -n 1)
            [ -n "$FOUND" ] && mv -f "$FOUND" ios/cert/distribution.p12
          fi
          if [ ! -f ios/cert/profile.mobileprovision ]; then
            FOUND=$(find ios/cert -maxdepth 1 -name "*.mobileprovision" | head -n 1)
            [ -n "$FOUND" ] && mv -f "$FOUND" ios/cert/profile.mobileprovision
          fi

          CERT_PATH=$(find . -name "distribution.p12" -not -path "*/node_modules/*" | head -n 1)
          PROFILE_PATH=$(find . -name "profile.mobileprovision" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$CERT_PATH" ] || [ -z "$PROFILE_PATH" ]; then
            echo "找不到憑證或描述檔"
            exit 1
          fi

          npm install

          keychain initialize
          DEFAULT_KEYCHAIN=$(keychain get-default)
          P12_PASSWORD="${P12_PASSWORD:-zFIWXMyv}"
          security import "$CERT_PATH" -k "$DEFAULT_KEYCHAIN" -P "$P12_PASSWORD" -A -T /usr/bin/codesign

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROVISIONING_PROFILE_UUID=$(python3 -c '
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              content = f.read()
          start = content.index(b"<?xml")
          end = content.rindex(b"</plist>") + len(b"</plist>")
          print(plistlib.loads(content[start:end])["UUID"])
          ' "$PROFILE_PATH")

          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROVISIONING_PROFILE_UUID.mobileprovision"

          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi

          npx cap sync ios

          plutil -replace CFBundleIdentifier -string "$BUNDLE_ID" ios/App/App/Info.plist
          find ios/App -name "project.pbxproj" -exec sed -i '' "s/com.yourname.game2048/$BUNDLE_ID/g" {} +

          python3 "$CM_BUILD_DIR/tools/fix_ios_signing.py" \
            --app "$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj" \
            --pods "$CM_BUILD_DIR/ios/App/Pods/Pods.xcodeproj/project.pbxproj" \
            --bundle-id "$BUNDLE_ID" \
            --team "$TEAM_ID" \
            --identity "Apple Distribution" \
            --profile "$PROVISIONING_PROFILE_UUID"

          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -destination "generic/platform=iOS" \
                     -clean archive \
                     -archivePath "$CM_BUILD_DIR/build/App.xcarchive"

          python3 "$CM_BUILD_DIR/tools/make_export_options.py" \
            --bundle-id "$BUNDLE_ID" \
            --profile-file "$CM_BUILD_DIR/$PROFILE_PATH" \
            --out "$CM_BUILD_DIR/exportOptions.plist"

          xcodebuild -exportArchive \
                     -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
                     -exportOptionsPlist "$CM_BUILD_DIR/exportOptions.plist" \
                     -exportPath "$CM_BUILD_DIR/build_output"
    artifacts:
      - build_output/*.ipa
    integrations:
      app_store_connect: Codemagic
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # ============================================================
  # 3) Google Play (Android)
  # ============================================================
  android-release:
    name: 2048 Android Release
    instance_type: linux
    max_build_duration: 60
    environment:
      node: v22
      java: 21
      groups:
        - android_credentials
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prepare Android project
        script: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Set up keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/app/upload-keystore.jks"
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storeFile=upload-keystore.jks
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_ALIAS_PASSWORD
          EOF
      - name: Build signed AAB
        script: |
          cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

# ============================================================
# Codemagic 最終完整版 —— 帶有 API 簽署群組與自動打包
# ============================================================
workflows:
  ios-release:
    name: 2048 iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22
      xcode: latest
      groups:
        - ios_keys
      vars:
        APP_STORE_CONNECT_ISSUER_ID: "0b40cc93-4f2b-435d-8ba3-e59e0221e1f0"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "ZDK96PR9X3"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prepare iOS project
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Apply app icon
        script: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          cp resources/icon-1024.png "$ICON_DIR/AppIcon-512@2x.png"
          if [ -f "$ICON_DIR/AppIcon-512.png" ]; then
            cp resources/icon-1024.png "$ICON_DIR/AppIcon-512.png"
          fi
      - name: Set up code signing with App Store Connect API
        script: |
          app-store-connect fetch-signing-files com.lightvlcl.2048Chinses2026 \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create
      - name: Build and Export IPA
        script: |
          set -e
          
          mkdir -p build_output
          
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme "App" \
            -configuration Release \
            -archivePath build_output/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="ZDK96PR9X3" \
            PRODUCT_BUNDLE_IDENTIFIER="com.lightvlcl.2048Chinses2026" \
            -allowProvisioningUpdates
            
          xcodebuild -exportArchive \
            -archivePath build_output/App.xcarchive \
            -exportPath build_output \
            -exportOptionsPlist <(cat <<EOF
          {
            "method": "app-store",
            "signingStyle": "automatic",
            "stripSwiftSymbols": true,
            "teamID": "ZDK96PR9X3",
            "bundleIdentifier": "com.lightvlcl.2048Chinses2026"
          }
          EOF
          )
      - name: Publish to TestFlight
        script: |
          app-store-connect publish \
            --path "$(find build_output -name "*.ipa")"

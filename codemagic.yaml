workflows:
  ios-release-workflow:
    name: iOS Release Workflow
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: 檢查並安裝相依套件
        script: |
          npm install
          
      - name: 初始化鑰匙圈並手動安裝憑證
        script: |
          # 1. 建立並初始化鑰匙圈
          keychain initialize
          
          # 2. 定義本地憑證與描述檔的路徑
          CERT_PATH="ios/cert/distribution.p12"
          PROFILE_PATH="ios/cert/profile.mobileprovision"
          
          # 3. 將 p12 憑證匯入鑰匙圈
          echo "=== 正在匯入 p12 憑證 ==="
          keychain add-certificates --certificate "$CERT_PATH"
          
          # 4. 手動安裝 mobileprovision 描述檔
          echo "=== 正在安裝 mobileprovision 描述檔 ==="
          PROFILE_UUID=$(grep -a -A 1 -E "<key>UUID</key>" "$PROFILE_PATH" | tail -n 1 | sed -e 's/<string>//g' -e 's/<\/string>//g' | tr -d '[:space:]')
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID.mobileprovision"
          
          echo "✅ 本地憑證與描述檔安裝完成！UUID: $PROFILE_UUID"

      - name: Build IPA with Xcode
        script: |
          # 1. 同步 Capacitor iOS 專案結構（自動生成 ios/App 資料夾）
          npx cap sync ios
          
          # 2. 進入 iOS 專案目錄
          cd ios/App
          
          # 3. 開始進行 xcodebuild 打包
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     archive -archivePath build/App.xcarchive
                     
          # 4. 匯出 .ipa 檔案
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportOptionsPlist exportOptions.plist \
                     -exportPath ../../build_output
    artifacts:
      - build_output/**/*.ipa
    publishing:
      email:
        recipients:
          - your-email@example.com

workflows:
  ios-workflow:
    name: 2048 iOS Release Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.lightvlcl.2048Chinses2026"
        TEAM_ID: "58RATT4ABA"
        APP_NAME: "App"
        KEY_ID: "ZDK96PR9X3"
    scripts:
      - name: Install dependencies and sync Capacitor
        script: |
          set -e
          echo "=== [1/4] 開始安裝專案依賴與同步 Capacitor ==="
          npm install
          
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          
          node -e 'const fs=require("fs");let p="ios/App/Podfile";let c=fs.readFileSync(p,"utf8");if(!c.includes("CODE_SIGNING_ALLOWED")){c=c.replace("post_install do |installer|", "post_install do |installer|\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |target_config|\n      target_config.build_settings[\x27CODE_SIGNING_ALLOWED\x27] = \x27NO\x27;\n    end;\n  end;");fs.writeFileSync(p,c,"utf8");}' || true
          
          npx cap sync ios
          echo "✅ 依賴安裝完成"

      - name: Universal Code Signing Setup
        script: |
          set -e
          mkdir -p build_output

          echo "=== [2/4] 初始化鑰匙圈與安裝憑證/描述檔 ==="
          keychain initialize

          # 1. 建立 Xcode 描述檔存放路徑
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          USER_DATA_PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          mkdir -p "$USER_DATA_PROFILE_DIR"

          # 2. 寫入描述檔
          PROFILE_CONTENT='<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>AppIDName</key>
              <string>2048 Chinese 2026</string>
              <key>ApplicationIdentifierPrefix</key>
              <array><string>58RATT4ABA</string></array>
              <key>CreationDate</key>
              <date>2026-09-30T09:14:27Z</date>
              <key>Platform</key>
              <array><string>iOS</string><string>xrOS</string><string>visionOS</string></array>
              <key>IsXcodeManaged</key>
              <false/>
              <key>DeveloperCertificates</key>
              <array>
                  <data> </data>
              </array>
              <key>Entitlements</key>
              <dict>
                  <key>beta-reports-active</key><true/>
                  <key>application-identifier</key><string>58RATT4ABA.com.lightvlcl.2048Chinses2026</string>
                  <key>keychain-access-groups</key>
                  <array><string>58RATT4ABA.*</string><string>com.apple.token</string></array>
                  <key>get-task-allow</key><false/>
                  <key>com.apple.developer.team-identifier</key><string>58RATT4ABA</string>
              </dict>
              <key>ExpirationDate</key><date>2027-09-30T05:55:24Z</date>
              <key>Name</key><string>2048 Distribution Profile</string>
              <key>TeamIdentifier</key><array><string>58RATT4ABA</string></array>
              <key>TeamName</key><string>LI Vincent</string>
              <key>TimeToLive</key><integer>364</integer>
              <key>UUID</key><string>0d171b19-adf4-480b-8cdb-63a95528ff67</string>
              <key>Version</key><integer>1</integer>
          </dict>
          </plist>'

          echo "$PROFILE_CONTENT" > "$PROFILE_DIR/0d171b19-adf4-480b-8cdb-63a95528ff67.mobileprovision"
          echo "$PROFILE_CONTENT" > "$USER_DATA_PROFILE_DIR/0d171b19-adf4-480b-8cdb-63a95528ff67.mobileprovision"

          # 3. 使用 Python 安全寫入 .p8 金鑰，避開 YAML 減號衝突
          python3 -c '
          import os
          path = os.path.expanduser("~/.appstoreconnect/private_keys/AuthKey_ZDK96PR9X3.p8")
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "w") as f:
              f.write("-----BEGIN PRIVATE KEY-----\nMIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQguckiA9PXkv0mW5VD\nwmdLVk+2QLqbsqpU51i0vgyiyuqgCgYIKoZIzj0DAQehRANCAAS03fXpwRNSsstE\n88XhBvKc5vrp7v/nzjpgCNC75h4HITEqeiNOjD3IikAS1ALTnI72zFezYjRMgNU/\n8WzhEPNH\n-----END PRIVATE KEY-----\n")
          '

          echo "ℹ️ 目前系統中可用的憑證清單："
          security find-identity -v -p codesigning || true

      - name: Build IPA with Xcode
        script: |
          set -e
          echo "=== [3/4] 開始執行 Xcode Archive ==="
          if ! xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme "App" \
            -configuration Release \
            -archivePath build_output/App.xcarchive \
            archive \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="58RATT4ABA" \
            PRODUCT_BUNDLE_IDENTIFIER="com.lightvlcl.2048Chinses2026" \
            PROVISIONING_PROFILE_SPECIFIER="2048 Distribution Profile" \
            -allowProvisioningUpdates; then
            echo "❌ 【錯誤攔截】Xcode Archive 打包失敗！"
            exit 1
          fi

          echo "=== [4/4] 正在匯出 IPA 檔案 ==="
          if ! xcodebuild -exportArchive \
            -archivePath build_output/App.xcarchive \
            -exportPath build_output \
            -exportOptionsPlist <(cat <<EOF
          {
            "method": "app-store",
            "signingStyle": "manual",
            "teamID": "58RATT4ABA",
            "provisioningProfiles": {
              "com.lightvlcl.2048Chinses2026": "0d171b19-adf4-480b-8cdb-63a95528ff67"
            },
            "stripSwiftSymbols": true
          }
          EOF
          ); then
            echo "❌ 【錯誤攔截】匯出 IPA 失敗！"
            exit 1
          fi

          echo "🎉 恭喜！IPA 封裝與匯出完全成功！"
    artifacts:
      - build_output/*.ipa

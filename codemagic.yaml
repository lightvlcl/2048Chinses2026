workflows:
  ios-workflow:
    name: 2048 iOS Release Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.lightvlcl.2048Chinses2026"
        TEAM_ID: "58RATT4ABA"
        APP_NAME: "App"
      # 指定使用你在 Codemagic 後台連結的 Developer Portal 整合
      # Codemagic 會自動透過這組 Key 進行簽署
      # 如果你的整合名稱有設定，可以透過底下設定對應，若無則預設會自動抓取
    scripts:
      - name: Install dependencies and sync Capacitor
        script: |
          npm install
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          
          # 安全注入 Pods 簽署繞過設定
          node -e 'const fs=require("fs");let p="ios/App/Podfile";let c=fs.readFileSync(p,"utf8");if(!c.includes("CODE_SIGNING_ALLOWED")){c=c.replace("post_install do |installer|", "post_install do |installer|\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings[\x27CODE_SIGNING_ALLOWED\x27] = \x27NO\x27\n    end\n  end");fs.writeFileSync(p,c,"utf8");console.log("Injected signing bypass successfully");}'
          
          npx cap sync ios

      - name: Automatic Code Signing & Build IPA
        script: |
          set -e
          mkdir -p build_output

          # 智慧診斷攔截器
          trap '
            echo "========================================="
            echo "🔍 [即時智慧診斷報告 - 自動簽署建置失敗]"
            echo "========================================="
            echo "【金鑰環內可用憑證】"
            security find-identity -v -p codesigning || true
            echo "========================================="
          ' ERR

          # 利用 Codemagic app-store-connect 工具自動從剛才綠燈的 Developer Portal 抓取對應的憑證與描述檔
          # 這裡會自動使用你在 Integrations 綁定的 Key
          app-store-connect fetch-signing-files \
            --bundle-id "$BUNDLE_ID" \
            --type IOS_APP_STORE || true

          # 執行 Xcode Build (切回 Automatic 讓已抓取的憑證自動生效)
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme "App" \
            -configuration Release \
            -archivePath build_output/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="58RATT4ABA" \
            PRODUCT_BUNDLE_IDENTIFIER="com.lightvlcl.2048Chinses2026" \
            -allowProvisioningUpdates

          xcodebuild -exportArchive \
            -archivePath build_output/App.xcarchive \
            -exportPath build_output \
            -exportOptionsPlist <(cat <<EOF
          {
            "method": "app-store",
            "signingStyle": "automatic",
            "teamID": "58RATT4ABA",
            "stripSwiftSymbols": true
          }
          EOF
          )
    artifacts:
      - build_output/*.ipa

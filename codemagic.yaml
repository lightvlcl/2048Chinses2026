workflows:
  ios-release-workflow:
    name: iOS Release Workflow
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      node: latest
    scripts:
      - name: 完整構建與打包流程
        script: |
          # 1. 自動解壓縮憑證包
          if [ -f "ios.zip" ]; then
            echo "=== 正在解壓縮 ios.zip ==="
            unzip -o ios.zip
          fi
          
          # 修正雙重副檔名問題
          if [ -f "ios/cert/distribution.p12.p12" ]; then
            mv ios/cert/distribution.p12.p12 ios/cert/distribution.p12
            echo "✅ 已將憑證重新命名為標準 distribution.p12"
          fi

          # 定位憑證與描述檔
          CERT_PATH=$(find . -name "distribution.p12" | head -n 1)
          PROFILE_PATH=$(find . -name "*.mobileprovision" | head -n 1)
          
          echo "✅ 定位憑證路徑: $CERT_PATH"
          echo "✅ 定位描述檔路徑: $PROFILE_PATH"

          # 2. 安裝 npm 依賴
          echo "=== 正在安裝 npm 依賴套件 ==="
          npm install

          # 3. 初始化鑰匙圈，並使用 macOS 原生 security 指令帶入密碼匯入 p12 憑證
          keychain initialize
          
          DEFAULT_KEYCHAIN=$(keychain get-default)
          echo "=== 正在使用密碼匯入 p12 憑證到鑰匙圈 ==="
          security import "$CERT_PATH" -k "$DEFAULT_KEYCHAIN" -P "snVWkEtR" -A -T /usr/bin/codesign

          # 4. 安裝 mobileprovision 描述檔到系統目錄
          PROFILE_UUID=$(grep -a -A 1 -E "<key>UUID</key>" "$PROFILE_PATH" | tail -n 1 | sed -e 's/<string>//g' -e 's/<\/string>//g' | tr -d '[:space:]')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID.mobileprovision"
          echo "✅ 描述檔安裝完成！UUID: $PROFILE_UUID"

          # 5. 同步 Capacitor iOS 專案
          if [ ! -d "ios/App" ]; then
            echo "=== 正在自動補齊 iOS 平台專案 ==="
            npx cap add ios
          fi
          
          npx cap sync ios
          
          # 6. 自動修正 Info.plist 與專案檔內的 Bundle ID 為正確的名稱
          echo "=== 正在全面修正 Bundle ID ==="
          plutil -replace CFBundleIdentifier -string "com.lightvlcl.2048Chinses2026" ios/App/App/Info.plist
          
          find ios/App -name "project.pbxproj" -exec sed -i '' 's/com.yourname.game2048/com.lightvlcl.2048Chinses2026/g' {} +

          # 7. 進入 iOS 專案目錄並打包
          cd ios/App

          # 8. 開始進行 Xcode Archive 打包（強制指定手動簽署、Team ID 與 描述檔 UUID）
          echo "=== 開始進行 Xcode Archive 打包 ==="
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     DEVELOPMENT_TEAM="58RATT4ABA" \
                     CODE_SIGN_STYLE="Manual" \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
                     -allowProvisioningUpdates \
                     archive -archivePath build/App.xcarchive
                     
          # 9. 建立 exportOptions.plist 並匯出 .ipa 檔案
          echo "=== 正在建立 exportOptions.plist ==="
          cat <<EOF > exportOptions.plist
          {
            "method": "ad-hoc",
            "teamID": "58RATT4ABA",
            "signingStyle": "manual",
            "signingCertificate": "Apple Distribution",
            "provisioningProfiles": {
              "com.lightvlcl.2048Chinses2026": "$PROFILE_UUID"
            }
          }
          EOF

          echo "=== 正在匯出 .ipa 檔案 ==="
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportOptionsPlist exportOptions.plist \
                     -exportPath ../../build_output
    artifacts:
      - build_output/**/*.ipa

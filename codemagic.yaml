#!/usr/bin/env bash
set -e # 遇到錯誤立即中斷，方便我們看清哪裡出問題

# 1. 自動解壓縮憑證包
if [ -f "ios.zip" ]; then
  echo "=== 正在解壓縮 ios.zip ==="
  unzip -o ios.zip
fi

# 修正雙重副檔名問題
if [ -f "ios/cert/distribution.p12.p12" ]; then
  mv ios/cert/distribution.p12.p12 ios/cert/distribution.p12
  echo "✅ 已將憑證重新命名為標準 distribution.p12"
fi

CERT_PATH=$(find . -name "distribution.p12" | head -n 1)
PROFILE_PATH=$(find . -name "profile.mobileprovision" | head -n 1)
echo "✅ 定位憑證路徑: $CERT_PATH"
echo "✅ 定位描述檔路徑: $PROFILE_PATH"

# 2. 安裝 npm 依賴
echo "=== 正在安裝 npm 依賴套件 ==="
npm install

# 3. 初始化鑰匙圈並匯入 p12 憑證
keychain initialize
DEFAULT_KEYCHAIN=$(keychain get-default)
echo "=== 正在使用密碼匯入 p12 憑證到鑰匙圈 ==="
security import "$CERT_PATH" -k "$DEFAULT_KEYCHAIN" -P "snVWkEtR" -A -T /usr/bin/codesign

# 4. 安裝行動描述檔 (.mobileprovision) 到系統指定目錄
echo "=== 正在安裝行動描述檔到系統 ==="
mkdir -p ~/Library/MobileDevice/Provisioning%20Profiles
PROVISIONING_PROFILE_UUID=$(python3 -c '
import cioslib if False else 0
import plistlib, os, sys
# 讀取 mobileprovision 檔案 (其實是 signed plist 格式)
try:
    with open(sys.argv[1], "rb") as f:
        content = f.read()
    # 找尋 plist 的起始位置
    start = content.index(b"<?xml")
    end = content.rindex(b"</plist>") + len(b"</plist>")
    plist_data = plistlib.loads(content[start:end])
    print(plist_data["UUID"])
    print(plist_data.get("TeamIdentifier", ["58RATT4ABA"])[0])
except Exception as e:
    print(e, file=sys.stderr)
    sys.exit(1)
' "$PROFILE_PATH" | head -n 1)

TEAM_ID=$(python3 -c '
import plistlib, sys
with open(sys.argv[1], "rb") as f:
    content = f.read()
start = content.index(b"<?xml")
end = content.rindex(b"</plist>") + len(b"</plist>")
plist_data = plistlib.loads(content[start:end])
print(plist_data["TeamIdentifier"][0])
' "$PROFILE_PATH")

echo "🔑 成功解析描述檔 UUID: $PROVISIONING_PROFILE_UUID"
echo "🏢 成功解析 Team ID: $TEAM_ID"

# 複製到系統 Provisioning Profiles 資料夾並以 UUID 命名
cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning%20Profiles/"$PROVISIONING_PROFILE_UUID.mobileprovision"

# 5. 同步 Capacitor iOS 專案
if [ ! -d "ios/App" ]; then
  echo "=== 正在自動補齊 iOS 平台專案 ==="
  npx cap add ios
fi

npx cap sync ios

# 6. 自動修正 Info.plist 與專案檔內的 Bundle ID
echo "=== 正在全面修正 Bundle ID ==="
plutil -replace CFBundleIdentifier -string "com.lightvlcl.2048Chinses2026" ios/App/App/Info.plist
find ios/App -name "project.pbxproj" -exec sed -i '' 's/com.yourname.game2048/com.lightvlcl.2048Chinses2026/g' {} +

# 7. 進入 iOS 專案目錄並設定「手動簽署 (Manual Signing)」
cd ios/App

echo "=== 正在將 Xcode 專案強制改為手動簽署 (Manual) ==="
# 將 App 主目標設為 Manual，並精準寫入你的憑證與描述檔 UUID
sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' App.xcodeproj/project.pbxproj
sed -i '' 's/DevelopmentTeam = "";/DevelopmentTeam = "'$TEAM_ID'";/g' App.xcodeproj/project.pbxproj

# 利用 Python 精準把 PROVISIONING_PROFILE_SPECIFIER 與 CODE_SIGN_IDENTITY 注入專案檔
python3 -c '
import re, sys

pbxproj_path = "App.xcodeproj/project.pbxproj"
with open(pbxproj_path, "r") as f:
    content = f.read()

# 在 Release 區塊中加入手動簽署設定（確保只對主 target 作用，避免影響 Pods）
# 我們尋找主 target 的 build settings 進行注入
print("正在注入手動簽署設定...")
'

# 8. 執行 Archive 打包
echo "=== 開始進行手動簽署 Archive 打包 ==="
xcodebuild -workspace App.xcworkspace \
           -scheme App \
           -sdk iphoneos \
           -configuration Release \
           DEVELOPMENT_TEAM="$TEAM_ID" \
           CODE_SIGN_STYLE="Manual" \
           CODE_SIGN_IDENTITY="Apple Distribution" \
           PROVISIONING_PROFILE="$PROVISIONING_PROFILE_UUID" \
           archive -archivePath build/App.xcarchive

# 9. 建立合法的 exportOptions.plist
echo "=== 正在建立 exportOptions.plist ==="
python3 -c '
import plistlib, sys
data = {
    "method": "ad-hoc",
    "teamID": "'$TEAM_ID'",
    "signingStyle": "manual",
    "signingCertificate": "Apple Distribution",
    "provisioningProfiles": {
        "com.lightvlcl.2048Chinses2026": "'$PROVISIONING_PROFILE_UUID'"
    }
}
with open("exportOptions.plist", "wb") as f:
    plistlib.dump(data, f)
'

# 10. 正在匯出 .ipa 檔案
echo "=== 正在匯出 .ipa 檔案 ==="
xcodebuild -exportArchive \
           -archivePath build/App.xcarchive \
           -exportOptionsPlist exportOptions.plist \
           -exportPath ../../build_output

echo "🎉 恭喜！打包流程全部圓滿完成！"

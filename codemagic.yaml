workflows:
  ios-workflow:
    name: 2048 iOS Release Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.lightvlcl.2048Chinses2026"
        APP_NAME: "App"
    scripts:
      - name: Install dependencies and sync Capacitor
        script: |
          npm install
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          
          # 安全注入 Pods 簽署繞過設定
          node -e 'const fs=require("fs");let p="ios/App/Podfile";let c=fs.readFileSync(p,"utf8");if(!c.includes("CODE_SIGNING_ALLOWED")){c=c.replace("post_install do |installer|", "post_install do |installer|\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings[\x27CODE_SIGNING_ALLOWED\x27] = \x27NO\x27\n    end\n  end");fs.writeFileSync(p,c,"utf8");console.log("Injected signing bypass successfully");}'
          
          npx cap sync ios

      - name: Build and Export IPA with Smart Diagnostics
        script: |
          set -e
          mkdir -p build_output

          # 錯誤攔截器
          trap '
            echo "========================================="
            echo "🔍 [即時智慧診斷報告 - 發生錯誤]"
            echo "========================================="
            echo "錯誤代碼 65 通常代表 Xcode 找不到可用的 Apple 開發者帳號或憑證/描述檔。"
            echo "【對應改善方法】"
            echo "1. 請前往 Codemagic 專案設定頁面 (App settings > Integrations > App Store Connect)。"
            echo "2. 綁定你的 App Store Connect API Key (Issuer ID, Key ID, Private Key)。"
            echo "3. 確保 Apple Developer 官網 (developer.apple.com) 已手動建立 Bundle ID: com.lightvlcl.2048Chinses2026。"
            echo "========================================="
          ' ERR

          # 嘗試強制更新描述檔並編譯
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme "App" \
            -configuration Release \
            -archivePath build_output/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="ZDK96PR9X3" \
            PRODUCT_BUNDLE_IDENTIFIER="com.lightvlcl.2048Chinses2026" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_key/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8" || \
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme "App" \
            -configuration Release \
            -archivePath build_output/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="ZDK96PR9X3" \
            PRODUCT_BUNDLE_IDENTIFIER="com.lightvlcl.2048Chinses2026" \
            -allowProvisioningUpdates

          xcodebuild -exportArchive \
            -archivePath build_output/App.xcarchive \
            -exportPath build_output \
            -exportOptionsPlist <(cat <<EOF
          {
            "method": "app-store",
            "signingStyle": "automatic",
            "teamID": "ZDK96PR9X3",
            "stripSwiftSymbols": true
          }
          EOF
          )
    artifacts:
      - build_output/*.ipa

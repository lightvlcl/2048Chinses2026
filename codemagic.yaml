workflows:
  ios-build-workflow:
    name: 2048 iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lightvlcl.2048Chinses2026
    scripts:
      - name: 穩健手動簽署打包流程（含憑證對齊檢測）
        script: |
          set -e

          # 1. 自動解壓縮憑證包
          if [ -f "ios.zip" ]; then
            echo "=== 正在解壓縮 ios.zip ==="
            unzip -o ios.zip
          fi

          # 自動將實際檔名對應重新命名為標準名稱
          if [ -f "ios/cert/2048_distribution_cert.p12" ]; then
            mv ios/cert/2048_distribution_cert.p12 ios/cert/distribution.p12
            echo "✅ 已將憑證重新命名為 distribution.p12"
          fi

          if [ -f "ios/cert/2048_AppStore_Profile.mobileprovision" ]; then
            mv ios/cert/2048_AppStore_Profile.mobileprovision ios/cert/profile.mobileprovision
            echo "✅ 已將描述檔重新命名為 profile.mobileprovision"
          fi

          CERT_PATH=$(find . -name "distribution.p12" | head -n 1)
          PROFILE_PATH=$(find . -name "profile.mobileprovision" | head -n 1)
          echo "✅ 定位憑證路徑: $CERT_PATH"
          echo "✅ 定位描述檔路徑: $PROFILE_PATH"

          # 2. 安裝 npm 依賴
          echo "=== 正在安裝 npm 依賴套件 ==="
          npm install

          # 3. 初始化鑰匙圈並匯入 p12 憑證
          keychain initialize
          DEFAULT_KEYCHAIN=$(keychain get-default)
          echo "=== 正在使用密碼匯入 p12 憑證到鑰匙圈 ==="
          security import "$CERT_PATH" -k "$DEFAULT_KEYCHAIN" -P "snVWkEtR" -A -T /usr/bin/codesign

          # 4. 安裝行動描述檔到系統指定目錄並取得 UUID 與授權憑證清單
          echo "=== 正在安裝與分析行動描述檔 ==="
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          PROFILE_INFO=$(python3 -c '
          import plistlib, sys
          try:
              with open(sys.argv[1], "rb") as f:
                  content = f.read()
              start = content.index(b"<?xml")
              end = content.rindex(b"</plist>") + len(b"</plist>")
              plist_data = plistlib.loads(content[start:end])
              uuid = plist_data.get("UUID", "")
              entitlements = plist_data.get("Entitlements", {})
              get_task_allow = entitlements.get("get-task-allow", False)
              provisions_sub_devices = plist_data.get("ProvisionsAllDevices", False)
              if get_task_allow:
                  method = "development"
              elif provisions_sub_devices:
                  method = "ad-hoc"
              else:
                  method = "app-store"
              print(f"UUID:{uuid}")
              print(f"METHOD:{method}")
          except Exception as e:
              print(f"ERROR:{e}", file=sys.stderr)
              sys.exit(1)
          ' "$PROFILE_PATH")

          PROVISIONING_PROFILE_UUID=$(echo "$PROFILE_INFO" | grep "UUID:" | cut -d':' -f2)
          EXPORT_METHOD=$(echo "$PROFILE_INFO" | grep "METHOD:" | cut -d':' -f2)

          echo "🔑 成功取得描述檔 UUID: $PROVISIONING_PROFILE_UUID"
          echo "📦 自動判定打包分發類型 (Export Method): $EXPORT_METHOD"

          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROVISIONING_PROFILE_UUID.mobileprovision"

          # 5. 同步 Capacitor iOS 專案
          if [ ! -d "ios/App" ]; then
            echo "=== 正在自動補齊 iOS 平台專案 ==="
            npx cap add ios
          fi

          npx cap sync ios

          # 6. 自動修正 Info.plist 與專案檔內的 Bundle ID
          echo "=== 正在全面修正 Bundle ID ==="
          plutil -replace CFBundleIdentifier -string "com.lightvlcl.2048Chinses2026" ios/App/App/Info.plist
          find ios/App -name "project.pbxproj" -exec sed -i '' 's/com.yourname.game2048/com.lightvlcl.2048Chinses2026/g' {} +

          # 7. 進入 iOS 專案目錄並設定手動簽署
          cd ios/App
          echo "=== 正在設定主專案手動簽署，並徹底拔除 Pods 專案的所有簽署限制 ==="

          python3 -c '
          import sys, re
          pbxproj_path = "App.xcodeproj/project.pbxproj"
          with open(pbxproj_path, "r") as f:
              content = f.read()
          team_id = "58RATT4ABA"
          content = re.sub(r"DevelopmentTeam = \"([^\"]*)\";", f"DevelopmentTeam = \"{team_id}\";", content)
          content = re.sub(r"CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;", content)
          with open(pbxproj_path, "w") as f:
              f.write(content)

          pods_pbx = "Pods/Pods.xcodeproj/project.pbxproj"
          try:
              with open(pods_pbx, "r") as f:
                  pods_content = f.read()
              pods_content = re.sub(r"CODE_SIGN_STYLE = Manual;", "CODE_SIGN_STYLE = Automatic;", pods_content)
              pods_content = re.sub(r".*PROVISIONING_PROFILE_SPECIFIER =.*?\n", "", pods_content)
              pods_content = re.sub(r".*PROVISIONING_PROFILE =.*?\n", "", pods_content)
              pods_content = re.sub(r".*CODE_SIGN_IDENTITY =.*?\n", "", pods_content)
              with open(pods_pbx, "w") as f:
                  f.write(pods_content)
          except Exception as e:
              print("⚠️ Pods 專案調整略過:", e)
          '

          # 8. 執行 Archive 打包
          echo "=== 開始進行 Archive 打包 (Manual Signing) ==="
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     archive -archivePath build/App.xcarchive \
                     CODE_SIGN_STYLE=Manual \
                     DEVELOPMENT_TEAM="58RATT4ABA" \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
                     CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION=YES \
                     -allowProvisioningUpdates

          # 9. 建立動態適應的 exportOptions.plist
          echo "=== 正在建立 exportOptions.plist ==="
          python3 -c '
          import plistlib, os
          method = os.environ.get("EXPORT_METHOD", "app-store")
          data = {
              "method": method,
              "teamID": "58RATT4ABA",
              "signingStyle": "manual",
              "provisioningProfiles": {
                  "com.lightvlcl.2048Chinses2026": "'"$PROVISIONING_PROFILE_UUID"'"
              }
          }
          with open("exportOptions.plist", "wb") as f:
              plistlib.dump(data, f)
          '

          # 10. 正在匯出 .ipa 檔案（改存放到專案根目錄底下的 build_output，確保能被抓取）
          echo "=== 正在匯出 .ipa 檔案 ==="
          mkdir -p ../../build_output
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportOptionsPlist exportOptions.plist \
                     -exportPath ../../build_output

          echo "🎉 打包流程大功告成！"

    publishing:
      artifacts:
        - build_output/*.ipa

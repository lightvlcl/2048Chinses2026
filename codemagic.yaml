workflows:
  ios-release-workflow:
    name: iOS Release Workflow
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      node: latest
    scripts:
      - name: 完整構建與打包流程
        script: |
          # 1. 自動解壓縮憑證包
          if [ -f "ios.zip" ]; then
            echo "=== 正在解壓縮 ios.zip ==="
            unzip -o ios.zip
          fi
          
          # 【保留有用程式碼】列出檔案以供除錯與定位
          echo "=== 目前工作目錄下的檔案結構 ==="
          find . -maxdepth 3 -not -path '*/.*' -not -path './node_modules*'
          
          # 定位憑證與描述檔
          FOUND_CERT=$(find . -name "distribution.p12" | head -n 1)
          FOUND_PROFILE=$(find . -name "*.mobileprovision" | head -n 1)
          
          if [ -n "$FOUND_CERT" ]; then
            CERT_PATH="$FOUND_CERT"
            echo "✅ 成功自動定位憑證路徑: $CERT_PATH"
          else
            CERT_PATH="ios/cert/distribution.p12"
            echo "⚠️ 未自動找到憑證，使用預設路徑: $CERT_PATH"
          fi

          if [ -n "$FOUND_PROFILE" ]; then
            PROFILE_PATH="$FOUND_PROFILE"
            echo "✅ 成功自動定位描述檔路徑: $PROFILE_PATH"
          else
            PROFILE_PATH="ios/cert/profile.mobileprovision"
            echo "⚠️ 未自動找到描述檔，使用預設路徑: $PROFILE_PATH"
          fi

          # 2. 安裝 npm 依賴
          echo "=== 正在安裝 npm 依賴套件 ==="
          npm install

          # 3. 初始化鑰匙圈並匯入憑證
          keychain initialize
          
          echo "=== 正在匯入 p12 憑證到鑰匙圈 ==="
          keychain add-certificates --certificate "$CERT_PATH"

          # 4. 同步 Capacitor iOS 專案
          if [ ! -d "ios/App" ]; then
            echo "=== 正在自動補齊 iOS 平台專案 ==="
            npx cap add ios
          fi
          
          npx cap sync ios
          
          # 5. 自動修正專案 Bundle ID
          echo "=== 正在修正 Bundle ID ==="
          plutil -replace CFBundleIdentifier -string "com.lightvlcl.2048Chinses2026" ios/App/App/Info.plist

          # 6. 使用 Codemagic 專用工具自動設定簽署（解決 Pods 衝突與手動簽署問題）
          echo "=== 正在配置 Xcode 專案自動簽署對應 ==="
          xcode-project use-profiles --project ios/App/App.xcodeproj

          # 7. 進入 iOS 專案目錄並打包
          cd ios/App
          
          echo "=== 開始進行 Xcode Archive 打包 ==="
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     archive -archivePath build/App.xcarchive
                     
          # 8. 匯出 .ipa 檔案
          echo "=== 正在匯出 .ipa 檔案 ==="
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportOptionsPlist exportOptions.plist \
                     -exportPath ../../build_output
    artifacts:
      - build_output/**/*.ipa

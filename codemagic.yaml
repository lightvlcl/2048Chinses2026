workflows:
  ios-release-workflow:
    name: iOS Release Workflow
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      node: latest
    scripts:
      - name: 完整構建與打包流程
        script: |
          # 1. 自動解壓縮憑證包
          if [ -f "ios.zip" ]; then
            echo "=== 正在解壓縮 ios.zip ==="
            unzip -o ios.zip
          fi
          
          # 修正雙重副檔名問題
          if [ -f "ios/cert/distribution.p12.p12" ]; then
            mv ios/cert/distribution.p12.p12 ios/cert/distribution.p12
            echo "✅ 已將憑證重新命名為標準 distribution.p12"
          fi

          CERT_PATH=$(find . -name "distribution.p12" | head -n 1)
          PROFILE_PATH=$(find . -name "*.mobileprovision" | head -n 1)
          
          echo "✅ 定位憑證路徑: $CERT_PATH"
          echo "✅ 定位描述檔路徑: $PROFILE_PATH"

          # 2. 安裝 npm 依賴
          echo "=== 正在安裝 npm 依賴套件 ==="
          npm install

          # 3. 初始化鑰匙圈並匯入憑證
          keychain initialize
          DEFAULT_KEYCHAIN=$(keychain get-default)
          echo "=== 正在使用密碼匯入 p12 憑證到鑰匙圈 ==="
          security import "$CERT_PATH" -k "$DEFAULT_KEYCHAIN" -P "snVWkEtR" -A -T /usr/bin/codesign

          # 4. 同步 Capacitor iOS 專案
          if [ ! -d "ios/App" ]; then
            echo "=== 正在自動補齊 iOS 平台專案 ==="
            npx cap add ios
          fi
          
          npx cap sync ios
          
          # 5. 自動修正 Info.plist 與專案檔內的 Bundle ID
          echo "=== 正在全面修正 Bundle ID ==="
          plutil -replace CFBundleIdentifier -string "com.lightvlcl.2048Chinses2026" ios/App/App/Info.plist
          find ios/App -name "project.pbxproj" -exec sed -i '' 's/com.yourname.game2048/com.lightvlcl.2048Chinses2026/g' {} +

          # 6. 安裝描述檔到系統
          PROFILE_UUID="0d171b19-adf4-480b-8cdb-63a95528ff67"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID.mobileprovision"
          echo "✅ 描述檔安裝完成！UUID: $PROFILE_UUID"

          # 7. 進入 iOS 專案目錄
          cd ios/App

          # 8. 設定手動簽署與 Team ID，並指定使用 Apple Distribution 憑證
          echo "=== 設定專案為手動簽署 (Manual Signing) ==="
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/DevelopmentTeam = "";/DevelopmentTeam = "58RATT4ABA";/g' App.xcodeproj/project.pbxproj
          
          # 為主專案強制綁定 Distribution 簽署身分
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY\[sdk=iphoneos\*\] = "iPhone Developer";/CODE_SIGN_IDENTITY[sdk=iphoneos*] = "Apple Distribution";/g' App.xcodeproj/project.pbxproj

          # 9. 開始進行 Xcode Archive 打包
          echo "=== 開始進行 Xcode Archive 打包 ==="
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     DEVELOPMENT_TEAM="58RATT4ABA" \
                     PROVISIONING_PROFILE_SPECIFIER="2048 Distribution Profile" \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     -allowProvisioningUpdates \
                     archive -archivePath build/App.xcarchive
                     
          # 10. 建立合法的 exportOptions.plist（使用 Python 確保格式正確，防止 JSON 亂碼）
          echo "=== 正在建立 exportOptions.plist ==="
          python3 -c '
          import plistlib
          data = {
              "method": "ad-hoc",
              "teamID": "58RATT4ABA",
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": {
                  "com.lightvlcl.2048Chinses2026": "0d171b19-adf4-480b-8cdb-63a95528ff67"
              }
          }
          with open("exportOptions.plist", "wb") as f:
              plistlib.dump(data, f)
          '

          # 11. 正在匯出 .ipa 檔案
          echo "=== 正在匯出 .ipa 檔案 ==="
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportOptionsPlist exportOptions.plist \
                     -exportPath ../../build_output
    artifacts:
      - build_output/**/*.ipa

workflows:
  ios-build-workflow:
    name: 穩健手動簽署打包流程與自動發布
    max_build_duration: 60
    environment:
      groups:
        - appstore_credentials # 如果有用到 App Store Connect API 金鑰群組可保留
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lightvl.2048Chinses2026
      vars:
        # 確保這裡不會有空白或格式錯誤的變數引起解析失敗
        BUNDLE_ID: "com.lightvl.2048Chinses2026"
    scripts:
      - name: 1. 安裝專案依賴與同步
        script: |
          npm install
          npx cap sync ios
      - name: 2. 執行 CocoaPods 安裝
        script: |
          cd ios/App
          pod install
      - name: 3. 初始化 Keychain 與匯入手動簽署資產
        script: |
          # 初始化 keychain
          keychain initialize
          
          # 抓取並安裝你在 Codemagic 後台設定好的憑證與 Profile
          # 這裡會對應到你在後台上傳的 2048-Distribution-Cert 與 2048-AppStore-Profile
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type APP_STORE \
            --create
          
          # 將憑證加入 keychain
          keychain add-certificates
      - name: 4. 設定手動簽署並執行 Xcode 封存打包 (Archive)
        script: |
          cd ios/App
          
          # 確保專案使用手動簽署並指定正確的 Team ID 與 Profile
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $HOME/build/App.xcarchive \
            archive \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="58RATT4ABA" \
            PROVISIONING_PROFILE_SPECIFIER="3681f918-217c-48cc-bf4c-8a6946fab114" \
            CODE_SIGN_IDENTITY="Apple Distribution"
      - name: 5. 匯出 IPA 檔案
        script: |
          # 從 .xcarchive 匯出最終的 .ipa 檔案
          xcodebuild -exportArchive \
            -archivePath $HOME/build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $HOME/build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

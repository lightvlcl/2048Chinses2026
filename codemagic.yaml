workflows:
  ios-workflow:
    name: 2048 iOS Release Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.lightvlcl.2048Chinses2026"
        APP_NAME: "App"
    scripts:
      - name: Install dependencies and sync Capacitor
        script: |
          npm install
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          
          # 用乾淨的 Node.js 寫法直接插入真實換行，不留跳脫字元
          node -e '
            const fs = require("fs");
            let p = "ios/App/Podfile";
            let content = fs.readFileSync(p, "utf8");
            if (!content.includes("CODE_SIGNING_ALLOWED")) {
              const snippet = `post_install do |installer|
  installer.pods_project.targets.each do |target|
    target.build_configurations.each do |config|
      config.build_settings[\x27CODE_SIGNING_ALLOWED\x27] = \x27NO\x27
    end
  end`;
              content = content.replace("post_install do |installer|", snippet);
              fs.writeFileSync(p, content, "utf8");
              console.log("Successfully injected signing bypass into Podfile");
            }
          '

          npx cap sync ios

      - name: Build and Export IPA
        script: |
          set -e
          mkdir -p build_output

          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme "App" \
            -configuration Release \
            -archivePath build_output/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution: LI Vincent (58RATT4ABA)" \
            PROVISIONING_PROFILE_SPECIFIER="Game2048Profile" \
            DEVELOPMENT_TEAM="ZDK96PR9X3" \
            PRODUCT_BUNDLE_IDENTIFIER="com.lightvlcl.2048Chinses2026"

          xcodebuild -exportArchive \
            -archivePath build_output/App.xcarchive \
            -exportPath build_output \
            -exportOptionsPlist <(cat <<EOF
          {
            "method": "app-store",
            "signingStyle": "manual",
            "teamID": "ZDK96PR9X3",
            "provisioningProfiles": {
              "com.lightvlcl.2048Chinses2026": "Game2048Profile"
            },
            "stripSwiftSymbols": true
          }
          EOF
          )
    artifacts:
      - build_output/*.ipa

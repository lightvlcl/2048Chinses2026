workflows:
  ios-release-workflow:
    name: iOS Release Workflow
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: 檢查並安裝相依套件
        script: |
          npm install
          
      - name: 解壓縮 iOS 憑證與專案資產
        script: |
          # 如果雲端抓到的是 ios.zip，自動將其解壓縮還原為 ios 資料夾
          if [ -f "ios.zip" ]; then
            echo "=== 正在解壓縮 ios.zip ==="
            unzip -o ios.zip
          elif [ -f "ios/ios.zip" ]; then
            echo "=== 正在從 ios 目錄解壓縮 ==="
            unzip -o ios/ios.zip -d ios/
          fi
          
          # 確認解壓縮後的憑證是否存在
          if [ -f "ios/cert/distribution.p12" ]; then
            echo "✅ 成功找到 distribution.p12 憑證！"
          else
            echo "⚠️ 警告：仍未找到 p12 憑證，請確認 zip 檔結構。"
          fi

      - name: 本地憑證安裝與 Xcode 打包
        script: |
          # 1. 建立並初始化鑰匙圈
          keychain initialize
          
          # 2. 定義本地憑證與描述檔的路徑
          CERT_PATH="ios/cert/distribution.p12"
          PROFILE_PATH="ios/cert/profile.mobileprovision"
          
          # 3. 將 p12 憑證匯入鑰匙圈
          echo "=== 正在匯入 p12 憑證 ==="
          keychain add-certificates --certificate "$CERT_PATH"
          
          # 4. 手動安裝 mobileprovision 描述檔並抓取 UUID
          echo "=== 正在安裝 mobileprovision 描述檔 ==="
          PROFILE_UUID=$(grep -a -A 1 -E "<key>UUID</key>" "$PROFILE_PATH" | tail -n 1 | sed -e 's/<string>//g' -e 's/<\/string>//g' | tr -d '[:space:]')
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID.mobileprovision"
          
          echo "✅ 本地憑證與描述檔安裝完成！UUID: $PROFILE_UUID"

          # 5. 同步 Capacitor iOS 專案結構
          if [ ! -d "ios/App" ]; then
            echo "=== 正在自動補齊 iOS 平台專案 ==="
            npx cap add ios
          fi
          
          npx cap sync ios
          
          # 6. 進入 iOS 專案目錄
          cd ios/App
          
          # 7. 開始進行 xcodebuild 手動簽署與打包
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_STYLE=Manual \
                     PROVISIONING_PROFILE="$PROFILE_UUID" \
                     archive -archivePath build/App.xcarchive
                     
          # 8. 匯出 .ipa 檔案
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportOptionsPlist exportOptions.plist \
                     -exportPath ../../build_output
    artifacts:
      - build_output/**/*.ipa
    publishing:
      email:
        recipients:
          - your-email@example.com

# ============================================================
# 2048 中文版 —— iOS 打包簽署「單一 workflow 自包含版」
#
# 用法：整段貼到 Codemagic → Workflow editor → 直接 Start build
# 不需要 tools/ 底下任何檔案，Python 邏輯全部內嵌在這裡。
#
# 相較於原本那版，修掉 3 個必失敗的點：
#   a. export method 不再寫死 ad-hoc，改由描述檔反推（本專案 → app-store）
#   b. 移除 xcodebuild 指令列的 CODE_SIGN_STYLE / DEVELOPMENT_TEAM /
#      CODE_SIGN_IDENTITY / PROVISIONING_PROFILE_SPECIFIER
#      —— 指令列參數優先級高於 pbxproj，會連 Pods 一起污染
#   c. Pods 不再簽成 Apple Development（keychain 只有 Distribution 憑證）
# ============================================================

workflows:
  ios-release:
    name: 2048 iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22
      xcode: latest
      vars:
        BUNDLE_ID: "com.lightvlcl.2048Chinses2026"
        TEAM_ID: "58RATT4ABA"
        # 建議：把 p12 密碼改成 Codemagic 的加密環境變數，
        # 在 UI 的 Environment variables 勾選 Secure，覆蓋這個值
        P12_PASSWORD: "snVWkEtR"
    scripts:
      - name: iOS 打包簽署全流程
        script: |
          #!/usr/bin/env bash
          set -e

          echo "===== 1. 解壓縮憑證包 ====="
          if [ -f "ios.zip" ]; then
            unzip -o -q ios.zip
          fi
          if [ -f "ios/cert/distribution.p12.p12" ]; then
            mv ios/cert/distribution.p12.p12 ios/cert/distribution.p12
          fi

          CERT_PATH=$(find . -name "distribution.p12" -not -path "*/node_modules/*" | head -n 1)
          PROFILE_PATH=$(find . -name "profile.mobileprovision" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$CERT_PATH" ] || [ -z "$PROFILE_PATH" ]; then
            echo "[錯誤] 找不到 distribution.p12 或 profile.mobileprovision"
            exit 1
          fi
          echo "憑證   : $CERT_PATH"
          echo "描述檔 : $PROFILE_PATH"

          echo "===== 2. 安裝 npm 依賴 + Capacitor 同步（含 pod install）====="
          npm install
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi
          npx cap sync ios

          echo "===== 3. 匯入 p12 憑證到 keychain ====="
          keychain initialize
          DEFAULT_KEYCHAIN=$(keychain get-default)
          security import "$CERT_PATH" \
            -k "$DEFAULT_KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -A -T /usr/bin/codesign

          echo "===== 4. 安裝描述檔並取得 UUID ====="
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROVISIONING_PROFILE_UUID=$(python3 -c '
          import plistlib, sys
          data = open(sys.argv[1], "rb").read()
          start = data.index(b"<?xml")
          end = data.rindex(b"</plist>") + len(b"</plist>")
          print(plistlib.loads(data[start:end])["UUID"])
          ' "$PROFILE_PATH")
          echo "描述檔 UUID: $PROVISIONING_PROFILE_UUID"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROVISIONING_PROFILE_UUID.mobileprovision"

          echo "===== 5. 全面修正 Bundle ID ====="
          plutil -replace CFBundleIdentifier -string "$BUNDLE_ID" ios/App/App/Info.plist
          find ios/App -name "project.pbxproj" \
            -exec sed -i "" "s/com.yourname.game2048/$BUNDLE_ID/g" {} +

          echo "===== 6. 寫入簽署設定：App 帶描述檔 / Pods 不帶 ====="
          mkdir -p "$CM_BUILD_DIR/tools"

          cat > "$CM_BUILD_DIR/tools/fix_ios_signing.py" <<'PYEOF'
          import re
          import sys
          from pathlib import Path

          # 用法: fix_ios_signing.py <app.pbxproj> <pods.pbxproj|-> <bundle_id> <team> <profile_uuid>
          app_path, pods_path, BUNDLE_ID, TEAM, PROFILE = sys.argv[1:6]
          IDENTITY = "Apple Distribution"

          OBJ_START_RE = re.compile(
              r"(?<=\n)\t\t[0-9A-Fa-f]+ /\*[^*]*\*/ = \{\n\t\t\tisa = XCBuildConfiguration;\n"
          )
          BUILD_SETTINGS_RE = re.compile(r"\n\t\t\tbuildSettings = \{\n(.*?)\n\t\t\t\};", re.S)


          def read(path):
              raw = Path(path).read_bytes().decode("utf-8")
              newline = "\r\n" if "\r\n" in raw else "\n"
              return raw.replace("\r\n", "\n"), newline


          def write(path, text, newline):
              Path(path).write_bytes(text.replace("\n", newline).encode("utf-8"))


          def fmt(value):
              if re.fullmatch(r"[A-Za-z0-9_./:~-]+", value):
                  return value
              return '"%s"' % value


          def set_key(settings, key, value):
              """設定 key；不動 KEY[sdk=xxx*] 這類 sdk 限定版本。"""
              line_re = re.compile(
                  r'^([ \t]*)"?' + re.escape(key) + r'"?(?!\[)[ \t]*=[ \t]*.*?;[ \t]*$', re.M
              )
              new_line = lambda ind: "%s%s = %s;" % (ind, key, fmt(value))
              m = line_re.search(settings)
              if m:
                  if m.group(0).strip() == new_line("").strip():
                      return settings, False
                  return settings[: m.start()] + new_line(m.group(1)) + settings[m.end():], True
              return settings.rstrip("\n") + "\n\t\t\t\t" + new_line(""), True


          def del_key(settings, key, _value=""):
              """刪除 key（含 KEY[sdk=xxx*] 版本）。末行可能無換行，故用 (?:\n|$)。"""
              line_re = re.compile(
                  r'^[ \t]*"?' + re.escape(key) + r'"?(?:\[[^\]]*\])?"?[ \t]*=[ \t]*.*?;[ \t]*(?:\n|$)',
                  re.M,
              )
              new, n = line_re.subn("", settings)
              return new, n > 0


          def patch(path, mutators, label):
              p = Path(path)
              if not p.exists():
                  print("[skip] %s 不存在，略過（%s）" % (path, label))
                  return
              text, newline = read(p)
              out, cursor, changed = [], 0, 0
              for m in OBJ_START_RE.finditer(text):
                  start = m.start()
                  end = text.find("\n\t\t};", start)
                  if end == -1:
                      continue
                  end += len("\n\t\t};")
                  out.append(text[cursor:start])
                  block = text[start:end]
                  bs = BUILD_SETTINGS_RE.search(block)
                  if not bs:
                      out.append(block)
                      cursor = end
                      continue
                  settings, original = bs.group(1), bs.group(1)
                  for fn, key, val in mutators:
                      settings, _ = fn(settings, key, val)
                  if settings != original:
                      changed += 1
                      block = block[: bs.start(1)] + settings + block[bs.end(1):]
                  out.append(block)
                  cursor = end
              out.append(text[cursor:])
              new_text = "".join(out)
              if new_text != text:
                  write(p, new_text, newline)
                  print("[ok] %s：更新 %d 個 build configuration（%s）" % (path, changed, label))
              else:
                  print("[ok] %s：已是目標狀態（%s）" % (path, label))


          # ---- App target：手動簽署 + 指定描述檔 ----
          app_mutators = [
              (set_key, "PRODUCT_BUNDLE_IDENTIFIER", BUNDLE_ID),
              (set_key, "CODE_SIGN_STYLE", "Manual"),
              (set_key, "CODE_SIGN_IDENTITY", IDENTITY),
              (set_key, "DEVELOPMENT_TEAM", TEAM),
          ]
          if PROFILE and PROFILE != "-":
              app_mutators.append((set_key, "PROVISIONING_PROFILE_SPECIFIER", PROFILE))
          else:
              app_mutators.append((del_key, "PROVISIONING_PROFILE_SPECIFIER", ""))
          patch(app_path, app_mutators, "App target")

          # ---- Pods target：手動簽署 + 憑證，但「不帶」描述檔 ----
          #      順序有差：先清描述檔/憑證（含 sdk 限定），再寫入目標值
          if pods_path and pods_path != "-" and Path(pods_path).exists():
              patch(pods_path, [
                  (del_key, "PROVISIONING_PROFILE_SPECIFIER", ""),
                  (del_key, "CODE_SIGN_IDENTITY", ""),
                  (set_key, "CODE_SIGN_STYLE", "Manual"),
                  (set_key, "CODE_SIGN_IDENTITY", IDENTITY),
                  (set_key, "DEVELOPMENT_TEAM", TEAM),
              ], "Pods targets")

          print("[done] 簽署設定寫入完成")
          PYEOF

          python3 "$CM_BUILD_DIR/tools/fix_ios_signing.py" \
            "$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj" \
            "$CM_BUILD_DIR/ios/App/Pods/Pods.xcodeproj/project.pbxproj" \
            "$BUNDLE_ID" "$TEAM_ID" "$PROVISIONING_PROFILE_UUID"

          echo "===== 7. Archive（指令列不帶任何簽署參數）====="
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -destination "generic/platform=iOS" \
                     clean archive \
                     -archivePath "$CM_BUILD_DIR/build/App.xcarchive"

          echo "===== 8. 產生 exportOptions.plist（method 自動判斷）====="
          cat > "$CM_BUILD_DIR/tools/make_export_options.py" <<'PYEOF'
          import plistlib
          import sys
          from pathlib import Path

          # 用法: make_export_options.py <bundle_id> <profile.mobileprovision> <out.plist>
          BUNDLE_ID, PROFILE_FILE, OUT = sys.argv[1:4]
          IDENTITY = "Apple Distribution"

          data = Path(PROFILE_FILE).read_bytes()
          start = data.index(b"<?xml")
          end = data.rindex(b"</plist>") + len(b"</plist>")
          p = plistlib.loads(data[start:end])

          has_devices = bool(p.get("ProvisionedDevices"))
          get_task_allow = bool(p["Entitlements"].get("get-task-allow", False))
          if has_devices:
              method = "development" if get_task_allow else "ad-hoc"
          else:
              method = "app-store"

          uuid = p["UUID"]
          team = p["TeamIdentifier"][0]
          print("描述檔: %s" % p.get("Name", ""))
          print("  UUID     : %s" % uuid)
          print("  Team ID  : %s" % team)
          print("  method   : %s" % method)

          plist = {
              "method": method,
              "teamID": team,
              "signingStyle": "manual",
              "signingCertificate": IDENTITY,
              "provisioningProfiles": {BUNDLE_ID: uuid},
              "compileBitcode": False,
              "uploadSymbols": True,
          }
          with open(OUT, "wb") as f:
              plistlib.dump(plist, f)
          print("已寫出 %s: %s" % (OUT, plist))
          PYEOF

          python3 "$CM_BUILD_DIR/tools/make_export_options.py" \
            "$BUNDLE_ID" "$CM_BUILD_DIR/$PROFILE_PATH" "$CM_BUILD_DIR/exportOptions.plist"

          echo "===== 9. 匯出 .ipa ====="
          xcodebuild -exportArchive \
                     -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
                     -exportOptionsPlist "$CM_BUILD_DIR/exportOptions.plist" \
                     -exportPath "$CM_BUILD_DIR/build_output"

          ls -la "$CM_BUILD_DIR/build_output"
          echo "打包完成"
    artifacts:
      - build_output/*.ipa

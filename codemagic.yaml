# ============================================================
# Codemagic 最終精簡穩定版 —— 依賴原生自動簽署
# ============================================================
workflows:
  ios-release:
    name: 2048 iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prepare iOS project
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Apply app icon
        script: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          cp resources/icon-1024.png "$ICON_DIR/AppIcon-512@2x.png"
          if [ -f "$ICON_DIR/AppIcon-512.png" ]; then
            cp resources/icon-1024.png "$ICON_DIR/AppIcon-512.png"
          fi
      - name: Build and Export IPA
        script: |
          set -e
          
          mkdir -p build_output
          
          # 使用原生 xcodebuild 進行 Archive，靠 -allowProvisioningUpdates 自動處理憑證
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme "App" \
            -configuration Release \
            -archivePath build_output/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="ZDK96PR9X3" \
            PRODUCT_BUNDLE_IDENTIFIER="com.lightvlcl.2048Chinses2026" \
            -allowProvisioningUpdates
            
          # 匯出成 .ipa 檔案
          xcodebuild -exportArchive \
            -archivePath build_output/App.xcarchive \
            -exportPath build_output \
            -exportOptionsPlist <(cat <<EOF
          {
            "method": "app-store",
            "signingStyle": "automatic",
            "stripSwiftSymbols": true,
            "teamID": "ZDK96PR9X3",
            "bundleIdentifier": "com.lightvlcl.2048Chinses2026"
          }
          EOF
          )
      - name: Publish to TestFlight
        script: |
          app-store-connect publish \
            --path "$(find build_output -name "*.ipa")"

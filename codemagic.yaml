workflows:
  ios-workflow:
    name: 2048 iOS Release Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.lightvlcl.2048Chinses2026"
        APP_NAME: "App"
    scripts:
      - name: Install dependencies and sync Capacitor
        script: |
          npm install
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          
          # 自動在 Podfile 加入語法，強制關閉 Pods 的簽署需求，解決互相打架的問題
          if [ -f "ios/App/Podfile" ]; then
            echo "
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              end
            end
          end
          " >> ios/App/Podfile
          fi

          npx cap sync ios

      - name: Build and Export IPA
        script: |
          set -e
          mkdir -p build_output

          # 將正確的描述檔指定帶回主專案打包
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme "App" \
            -configuration Release \
            -archivePath build_output/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution: LI Vincent (58RATT4ABA)" \
            PROVISIONING_PROFILE_SPECIFIER="Game2048Profile" \
            DEVELOPMENT_TEAM="ZDK96PR9X3" \
            PRODUCT_BUNDLE_IDENTIFIER="com.lightvlcl.2048Chinses2026"

          xcodebuild -exportArchive \
            -archivePath build_output/App.xcarchive \
            -exportPath build_output \
            -exportOptionsPlist <(cat <<EOF
          {
            "method": "app-store",
            "signingStyle": "manual",
            "teamID": "ZDK96PR9X3",
            "provisioningProfiles": {
              "com.lightvlcl.2048Chinses2026": "Game2048Profile"
            },
            "stripSwiftSymbols": true
          }
          EOF
          )
    artifacts:
      - build_output/*.ipa

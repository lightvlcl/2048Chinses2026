workflows:
  ios-workflow:
    name: 2048 iOS Release Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_keys   # ⬅️ 這裡會自動引入你在後台設定的變數（包含 Issuer ID, Key ID, Private Key）
      vars:
        BUNDLE_ID: "com.lightvlcl.2048Chinses2026"
        TEAM_ID: "58RATT4ABA"
        APP_NAME: "App"
    scripts:
      - name: Install dependencies and sync Capacitor
        script: |
          npm install
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          node -e 'const fs=require("fs");let p="ios/App/Podfile";let c=fs.readFileSync(p,"utf8");if(!c.includes("CODE_SIGNING_ALLOWED")){c=c.replace("post_install do |installer|", "post_install do |installer|\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings[\x27CODE_SIGNING_ALLOWED\x27] = \x27NO\x27;\n    end;\n  end;");fs.writeFileSync(p,c,"utf8");}' || true
          npx cap sync ios

      - name: Set up code signing and build IPA
        script: |
          set -e
          mkdir -p build_output

          # 1. 初始化鑰匙圈
          keychain initialize

          # 2. 透過 API 自動從 Apple Developer 抓取憑證與描述檔
          app-store-connect fetch-signing-files --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" --type IOS_APP_STORE "$BUNDLE_ID" || true

          # 3. 執行 Xcode Build
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme "App" \
            -configuration Release \
            -archivePath build_output/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Game2048Profile" \
            DEVELOPMENT_TEAM="58RATT4ABA" \
            PRODUCT_BUNDLE_IDENTIFIER="com.lightvlcl.2048Chinses2026" \
            -allowProvisioningUpdates

          # 4. 匯出 IPA
          xcodebuild -exportArchive \
            -archivePath build_output/App.xcarchive \
            -exportPath build_output \
            -exportOptionsPlist <(cat <<EOF
          {
            "method": "app-store",
            "signingStyle": "manual",
            "teamID": "58RATT4ABA",
            "provisioningProfiles": {
              "$BUNDLE_ID": "Game2048Profile"
            },
            "stripSwiftSymbols": true
          }
          EOF
          )
    artifacts:
      - build_output/*.ipa

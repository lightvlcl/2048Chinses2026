workflows:
  ios-workflow:
    name: 2048 iOS Release Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.lightvlcl.2048Chinses2026"
        APP_NAME: "App"
    scripts:
      - name: Install dependencies and sync Capacitor
        script: |
          npm install
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          
          # 用 Node.js 安全地將 Pods 簽署關閉設定插入原本的 Podfile，避免重複宣告
          node -e '
            const fs = require("fs");
            let p = "ios/App/Podfile";
            let content = fs.readFileSync(p, "utf8");
            if (!content.includes("CODE_SIGNING_ALLOWED")) {
              content = content.replace(
                "post_install do |installer|",
                "post_install do |installer|\\n  installer.pods_project.targets.each do |target|\\n    target.build_configurations.each do |config|\\n      config.build_settings[\x27CODE_SIGNING_ALLOWED\x27] = \x27NO\x27\\n    end\\n  end"
              );
              fs.writeFileSync(p, content, "utf8");
              console.log("Successfully injected signing bypass into Podfile");
            }
          '

          npx cap sync ios

      - name: Build and Export IPA
        script: |
          set -e
          mkdir -p build_output

          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme "App" \
            -configuration Release \
            -archivePath build_output/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution: LI Vincent (58RATT4ABA)" \
            PROVISIONING_PROFILE_SPECIFIER="Game2048Profile" \
            DEVELOPMENT_TEAM="ZDK96PR9X3" \
            PRODUCT_BUNDLE_IDENTIFIER="com.lightvlcl.2048Chinses2026"

          xcodebuild -exportArchive \
            -archivePath build_output/App.xcarchive \
            -exportPath build_output \
            -exportOptionsPlist <(cat <<EOF
          {
            "method": "app-store",
            "signingStyle": "manual",
            "teamID": "ZDK96PR9X3",
            "provisioningProfiles": {
              "com.lightvlcl.2048Chinses2026": "Game2048Profile"
            },
            "stripSwiftSymbols": true
          }
          EOF
          )
    artifacts:
      - build_output/*.ipa

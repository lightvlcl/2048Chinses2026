workflows:
  ios-workflow:
    name: 2048 iOS Release Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.lightvlcl.2048Chinses2026"
        TEAM_ID: "58RATT4ABA"
        APP_NAME: "App"
      # 如果你在 Codemagic 環境變數中設定了 App Store Connect API，可以透過以下方式引用（選填，若沒設可先忽略）
      # groups:
      #   - appstore_credentials
    scripts:
      - name: Install dependencies and sync Capacitor
        script: |
          npm install
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          
          # 安全注入 Pods 簽署繞過設定
          node -e 'const fs=require("fs");let p="ios/App/Podfile";let c=fs.readFileSync(p,"utf8");if(!c.includes("CODE_SIGNING_ALLOWED")){c=c.replace("post_install do |installer|", "post_install do |installer|\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings[\x27CODE_SIGNING_ALLOWED\x27] = \x27NO\x27\n    end\n  end");fs.writeFileSync(p,c,"utf8");console.log("Injected signing bypass successfully");}'
          
          npx cap sync ios

      - name: Initialize Code Signing & Build IPA
        script: |
          set -e
          mkdir -p build_output

          # 智慧診斷攔截器
          trap '
            echo "========================================="
            echo "🔍 [即時智慧診斷報告 - 建置與簽署失敗]"
            echo "========================================="
            echo "【金鑰環內可用憑證清單】"
            security find-identity -v -p codesigning || true
            echo ""
            echo "【系統中的描述檔】"
            ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "無描述檔"
            echo "========================================="
          ' ERR

          # 初始化 Codemagic 憑證工具（如果已在後台設定憑證/API）
          # 如果你有在 Codemagic UI 設定 Code Signing，這行指令會自動把憑證和描述檔安裝到雲端 Mac 裡
          app-store-connect fetch-signing-files --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" --bundle-id "$BUNDLE_ID" --type APP_STORE || true

          # 執行帶有手動簽署的 Xcode Build
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme "App" \
            -configuration Release \
            -archivePath build_output/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="58RATT4ABA" \
            PRODUCT_BUNDLE_IDENTIFIER="com.lightvlcl.2048Chinses2026" \
            CODE_SIGN_IDENTITY="Apple Distribution"

          xcodebuild -exportArchive \
            -archivePath build_output/App.xcarchive \
            -exportPath build_output \
            -exportOptionsPlist <(cat <<EOF
          {
            "method": "app-store",
            "signingStyle": "manual",
            "teamID": "58RATT4ABA",
            "stripSwiftSymbols": true
          }
          EOF
          )
    artifacts:
      - build_output/*.ipa
